<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>King David - Business Card</title>
    <link rel="stylesheet" href="style.css"/>
  </head>
  <body>
    <div class="welcome-text-container">
      <div class="welcome-text">
        <span>Welcome to David's Business Card</span>
        <span>Welcome to David's Business Card</span>
        <span>Welcome to David's Business Card</span>
      </div>
    </div>
    <main class="card-container">
      <div class="business-card">
        <div class="background-image"></div>
        <div class="overlay"></div>
        
        <div class="card-content">
          <div class="top-section">
            <div class="logo-container">
              <img src="img/brand-logo-removebg-preview.png" alt="Brand Logo" class="brand-logo">
            </div>
            <div class="badge">NEW</div>
          </div>
          
          <div class="main-content">
            <div class="text-content">
              <h1 class="name">King David</h1>
              <h2 class="title">Global Marketing Director</h2>
              <p class="company">Coca-Cola Company</p>
              
              <div class="contact-info">
                <p class="contact-item">
                  <span class="icon">📞</span>
                  <span>+7 (9699) 2838-44</span>
                </p>
                <p class="contact-item">
                  <span class="icon">📧</span>
                  <a href="mailto:gratedavid@coca-cola.com">gratedavid@coca-cola.com</a>
                </p>
                <p class="contact-item">
                  <span class="icon">🌐</span>
                  <a href="http://www.coca-colacompany.com" target="_blank">www.coca-colacompany.com</a>
                </p>
              </div>
            </div>
            
            <div class="qr-container">
              <img src="img/qr_code.svg" alt="QR Code" class="qr-code">
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
